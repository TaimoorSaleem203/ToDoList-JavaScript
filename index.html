<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <section class="section-container">

    
    <form action="" class="form-container">
      <header class="app-header">
        <div class="header-icon"><i class="ri-checkbox-circle-line"></i></div>
        <div>
          <h1 class="heading">My Tasks</h1>
          <p class="subheading">Stay focused, get things done.</p>
        </div>
      </header>
      <div class="form-input">
        <div class="input-container">
          <label class="input-head">Task</label>
          <input type="text" class="todo-input" placeholder="Enter Task">
          <p class="input-sub">Please enter task</p>
        </div>
        <div class="input-container">
          <label class="input-head">Due Date</label>
          <input type="date" class="input-date">
          <p class="input-sub">Please select due date</p>
        </div>
        <div class="input-container">
          <label class="input-head">Active</label>
          <input type="checkbox" class="input-active">
          <br>
        </div>
        <div class="input-container">
          <label class="input-head">Status</label>
          <select name="status" class="status-bar">
            <option value="--Select--">--Select--</option>
            <option value="notstarted">Not Started</option>
            <option value="inprogress">In progress</option>
            <option value="completed">Completed</option>
            <option value="waiting">Waiting on someone else</option>
            <option value="deferred">Deferred</option>
          </select>
          <p class="input-sub">Please Select Status</p>
        </div>
        <div class="input-container">
          <label class="input-head">Priority</label>
          <select name="status" class="priority-bar">
            <option value="--Select--">--Select--</option>
            <option value="notstarted">Low</option>
            <option value="inprogress">Normal</option>
            <option value="completed">High</option>
          </select>
          <p class="input-sub">Please select priority</p>
        </div>
  
        <div class="input-btn">
          <button class="add-btn">Save</button>
        </div>
      </div>
      <table>
        <tr class="todo-head">
          <th>Task</th>
          <th>Due Date</th>
          <th>Created Date</th>
          <th>Active</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
        <tr class="todo-list">
        </tr>
      </table>

    </form>



  </section>

  <script src="script.js"></script>
</body>

</html>
