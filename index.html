<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <section class="section-container">


    <form action="" class="form-container">
      <div class="stats-row">
        <div class="stat-card" id="statTotal">
          <span class="stat-num">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card" id="statPending">
          <span class="stat-num">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card" id="statDone">
          <span class="stat-num">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>
      <div class="form-input">
        <div class="input-container search-bar">
          <label class="input-head">Search</label>
          <input type="text" class="todo-search" placeholder="Search">
          <p class="input-sub">Please search here</p>
        </div>
        <div class="filter-wrap">
          <button type="button" class="filter-toggle-btn">
            <i class="ri-filter-line filter-icon"></i>
          </button>
          <div class="filter-option">
            <span><input type="checkbox" class="all"> All</span>
            <span><input type="checkbox" class="progress">In Progress</span>
            <span><input type="checkbox" class="completed"> Completed</span>
          </div>
        </div>
        <div class="input-container">
          <label class="input-head">Task</label>
          <input type="text" class="todo-input" placeholder="Enter Task">
          <p class="input-sub">Please enter task</p>
        </div>
        <div class="input-container">
          <label class="input-head">Due Date</label>
          <input type="date" class="input-date">
          <p class="input-sub">Please select due date</p>
        </div>
        <div class="input-container">
          <label class="input-head">Active</label>
          <select name="status" class="active-bar">
            <option value="--Select--">--Select--</option>
            <option value="Active">Active</option>
            <option value="Block">Block</option>
          </select>
          <p class="input-sub">Please Select Active</p>
        </div>
        <div class="input-container">
          <label class="input-head">Status</label>
          <select name="status" class="status-bar">
            <option value="--Select--">--Select--</option>
            <option value="Not Started">Not Started</option>
            <option value="In progress">In progress</option>
            <option value="Completed">Completed</option>
            <option value="Waiting on someone else">Waiting on someone else</option>
            <option value="Deferred">Deferred</option>
          </select>
          <p class="input-sub">Please Select Status</p>
        </div>
        <div class="input-container">
          <label class="input-head">Priority</label>
          <select name="status" class="priority-bar">
            <option value="--Select--">--Select--</option>
            <option value="Low">Low</option>
            <option value="Normal">Normal</option>
            <option value="High">High</option>
          </select>
          <p class="input-sub">Please select priority</p>
        </div>

        <div class="input-btn">
          <button class="add-btn">Save</button>
        </div>


        <!-- <div class="input-btn">
          <button type="button" class="search-toggle-btn">
            <i class="ri-search-line search-icon"></i>
          </button>
        </div> -->
      </div>
      <table>
        <thead>
          <tr class="tr-head">
            <th>Task</th>
            <th>Due Date</th>
            <th>Created Date</th>
            <th>Active</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody class="todo-list">

        </tbody>
      </table>

    </form>



  </section>

  <script src="script.js"></script>
</body>

</html>
